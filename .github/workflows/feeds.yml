name: feeds
# Daily: imports the open price feeds (NDW, MobiData BW) into per-area files
# and publishes them on the `feeds` branch, one commit, replaced each day so
# the repository doesn't grow. The ChargeAhead backend reads them from there.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests
      - name: Import
        run: |
          # Yesterday's index, to refuse publishing a feed that failed.
          curl -fsS -o previous-index.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/feeds/ocpi/index.json" || true
          python3 feeds.py build out --previous previous-index.json
      - name: Publish to the feeds branch
        run: |
          cd out
          cat > README.md <<'MD'
          Open-data charging prices by area, imported daily by `feeds.py` on main.
          Netherlands: NDW open data (CC0). Germany: MobiData BW, "Gebündelte Daten
          E-Ladesäulen", Datenlizenz Deutschland Namensnennung 2.0
          (https://www.govdata.de/dl-de/by-2-0), changed (filtered, VAT added);
          sources named in each file under CC BY 4.0 where marked.
          MD
          git init -q -b feeds
          git add -A
          git -c user.name="chargeahead-prices" -c user.email="actions@users.noreply.github.com" \
            commit -qm "Price feeds $(date -u +%Y-%m-%d)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feeds
